name: "Verify Generated Files"
description: "Runs dart run build_runner build and fails if it changes or adds files. Run after setup."

inputs:
  working-directory:
    description: "Directory containing pubspec.yaml"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Verify generated files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/scripts/verify-generated.sh"
