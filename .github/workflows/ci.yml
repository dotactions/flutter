name: Flutter CI

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of build targets to compile (e.g. ''["linux"]'')'
        required: false
        type: string
        default: ""
      pr-targets:
        description: 'JSON array of targets to compile on pull_request (e.g. ''["linux"]'')'
        required: false
        type: string
        default: ""
      push-targets:
        description: 'JSON array of targets to compile on push / other events (e.g. ''["linux", "windows", "macos"]'')'
        required: false
        type: string
        default: ""
      flutter-version:
        description: "Flutter SDK version (empty reads environment.flutter from pubspec.yaml)"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory containing pubspec.yaml"
        required: false
        type: string
        default: "."
      build-mode:
        description: "Build mode: debug, profile, or release"
        required: false
        type: string
        default: ""
      pr-build-mode:
        description: "Build mode for pull requests"
        required: false
        type: string
        default: ""
      push-build-mode:
        description: "Build mode for push events"
        required: false
        type: string
        default: ""
      concurrency-tests:
        description: "Concurrency level for flutter test"
        required: false
        type: number
        default: 4
      coverage-report:
        description: "Post a coverage PR comment and status via getsentry/coverage-action"
        required: false
        type: boolean
        default: false
      verify-generated:
        description: "Fail if build_runner output is stale or uncommitted"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-mode: ${{ steps.set-matrix.outputs.build-mode }}
    steps:
      - id: set-matrix
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/matrix@v0.3.0
        with:
          targets: ${{ inputs.targets }}
          pr-targets: ${{ inputs.pr-targets }}
          push-targets: ${{ inputs.push-targets }}
          build-mode: ${{ inputs.build-mode }}
          pr-build-mode: ${{ inputs.pr-build-mode }}
          push-build-mode: ${{ inputs.push-build-mode }}

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/setup@v0.3.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - run: flutter analyze
        working-directory: ${{ inputs.working-directory }}
      - name: Verify generated files
        if: inputs.verify-generated
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/verify-generated@v0.3.0
        with:
          working-directory: ${{ inputs.working-directory }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/setup@v0.3.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - run: |
          args=("--concurrency=$CONCURRENCY")
          if [ "$COVERAGE" = "true" ]; then args+=(--coverage); fi
          flutter test "${args[@]}"
        working-directory: ${{ inputs.working-directory }}
        env:
          CONCURRENCY: ${{ inputs.concurrency-tests }}
          COVERAGE: ${{ inputs.coverage-report }}
      # why: generated code isn't meaningful to measure, and regenerated files would sink patch coverage;
      # lcov SF paths are package-relative, but PR diff matching needs repo-relative paths
      # TODO: revisit once coverage-action supports `ignore` for source files, and/or if we can get it to support repo-relative paths
      - name: Prepare coverage report
        if: inputs.coverage-report
        run: |
          f="$WD/coverage/lcov.info"
          awk '/^SF:.*\.(g|freezed)\.dart$/{s=1} !s; /^end_of_record/{s=0}' "$f" > "$f.tmp"
          mv "$f.tmp" "$f"
          if [ "$WD" != "." ]; then sed -i "s|^SF:|SF:${WD%/}/|" "$f"; fi
        env:
          WD: ${{ inputs.working-directory }}
      - name: Upload coverage
        if: inputs.coverage-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-coverage
          path: ${{ inputs.working-directory }}/coverage/lcov.info

  # why: the write token lives in a job that never runs the code under test
  # ponytail: consumers' coverage.yml `ignore` doesn't filter source files yet (coverage-action only applies it to the search for reports); takes effect once coverage-action fixes that
  report:
    name: Coverage report
    needs: test
    # why: fork PRs get a read-only token, so commenting would fail the run
    if: >-
      !cancelled() && inputs.coverage-report && needs.test.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-coverage

      - name: Report coverage
        uses: getsentry/coverage-action@b3db4e382bd9859c913a96093a3d369b67f59177 # 0.4.4
        with:
          token: ${{ github.token }}
          files: lcov.info
          disable-search: "true"
          coverage-format: lcov
          flags: flutter
          comment-key: flutter
          status-key: flutter
          title: Flutter coverage
          post-pr-comment: "true"
          enable-tests: "false"
          informational-project: "true"
          informational-patch: "true"

  build:
    name: Build (${{ matrix.target }} - ${{ needs.setup-matrix.outputs.build-mode }})
    needs: [setup-matrix, analyze, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build App
        id: build
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/build@v0.3.0
        with:
          target: ${{ matrix.target }}
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
          build-mode: ${{ needs.setup-matrix.outputs.build-mode }}
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.artifact-path }}
          retention-days: 7
