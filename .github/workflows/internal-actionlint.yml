name: Lint Workflows

on:
  pull_request:
    paths: &paths
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    uses: dotactions/tooling/.github/workflows/actionlint.yml@47e8ca68959cee5ae7b65b8110f4cf7d0a89decd # v1.1.0
