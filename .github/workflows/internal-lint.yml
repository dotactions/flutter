name: Lint Scripts

on:
  pull_request:
    paths: &paths
      - "**.sh"
      - "**.ps1"
      - ".tooling"
      - ".github/workflows/internal-lint.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: dotactions/tooling/.github/workflows/lint.yml@195e9ff7bbf3476b7fd9a9e3d9c05554c3b37fb5 # v1.2.1
