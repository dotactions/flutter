name: Check References

on:
  pull_request:
    paths: &paths
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-refs:
    uses: dotactions/tooling/.github/workflows/check-refs.yml@47e8ca68959cee5ae7b65b8110f4cf7d0a89decd # v1.1.0
