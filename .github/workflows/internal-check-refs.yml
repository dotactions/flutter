name: Check References

on:
  pull_request:
    paths: &paths
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-refs:
    uses: dotactions/tooling/.github/workflows/check-refs.yml@195e9ff7bbf3476b7fd9a9e3d9c05554c3b37fb5 # v1.2.1
