name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0, v0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: dotactions/tooling/.github/workflows/release.yml@1bfa08933d631ae3c3218f1362bed3660c4818b1 # v1.1.1
    with:
      version: ${{ inputs.version }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
