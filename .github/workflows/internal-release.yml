name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0, v0.1.0 or 0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: dotactions/tooling/.github/workflows/release.yml@195e9ff7bbf3476b7fd9a9e3d9c05554c3b37fb5 # v1.2.1
    with:
      version: ${{ inputs.version }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
