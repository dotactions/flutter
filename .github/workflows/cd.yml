name: Flutter CD

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of targets to build and release (e.g. ''["linux", "windows", "macos"]'')'
        required: true
        type: string
      tag:
        description: "Release tag (required unless triggered by a release or tag push)"
        required: false
        type: string
      flutter-version:
        description: "Flutter SDK version (empty reads environment.flutter from pubspec.yaml)"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory containing pubspec.yaml"
        required: false
        type: string
        default: "."
    secrets:
      token:
        description: "GitHub token with contents:write permission (defaults to github.token)"
        required: false

concurrency:
  group: flutter-cd-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Resolve Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Never fall back to a branch name: the upload action would create a release and tag named after it.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No release tag: pass the 'tag' input, or trigger on a release or tag push"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - id: set-matrix
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/matrix@main
        with:
          targets: ${{ inputs.targets }}

  build:
    name: Build & Upload (${{ matrix.target }})
    needs: [setup-matrix]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build App
        id: build
        # @main is rewritten to the exact release tag by internal-release.yml
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: dotactions/flutter/build@main
        with:
          target: ${{ matrix.target }}
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Upload binary to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          repo_token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          file: ${{ steps.build.outputs.artifact-path }}
          file_glob: true
          tag: ${{ needs.setup-matrix.outputs.tag }}
          overwrite: true
