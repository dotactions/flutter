name: Test Flutter Actions

on:
  pull_request:
    paths: &paths
      - "build/**"
      - "setup/**"
      - "matrix/**"
      - "verify-generated/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/internal-test.yml"
      - "tests/fixtures/**"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: "release"
            expected-suffix: ""
          - build-mode: "debug"
            expected-suffix: "-debug"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test build (${{ matrix.build-mode }})
        id: build-app
        uses: ./build
        with:
          target: "linux"
          build-mode: ${{ matrix.build-mode }}
          working-directory: "tests/fixtures"
      - name: Assert build artifacts and outputs
        shell: bash
        env:
          EXPECTED_NAME: "test_app-linux${{ matrix.expected-suffix }}"
          ARTIFACT_NAME: ${{ steps.build-app.outputs.artifact-name }}
          ARTIFACT_PATH: ${{ steps.build-app.outputs.artifact-path }}
        run: |
          DIST_DIR="$RUNNER_TEMP/flutter-dist/linux"
          test -f "$DIST_DIR/${EXPECTED_NAME}.tar.gz"
          tar -tzf "$DIST_DIR/${EXPECTED_NAME}.tar.gz" > /dev/null
          if [ "$ARTIFACT_NAME" != "$EXPECTED_NAME" ]; then
            echo "Expected artifact-name '$EXPECTED_NAME', got '$ARTIFACT_NAME'"
            exit 1
          fi
          if [ "$ARTIFACT_PATH" != "$DIST_DIR/*" ]; then
            echo "Expected artifact-path '$DIST_DIR/*', got '$ARTIFACT_PATH'"
            exit 1
          fi
          if [ -e tests/fixtures/dist ]; then
            echo "Packaging must not write into the working directory"
            exit 1
          fi

  test-setup-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use a caret constraint in the fixture
        run: |
          sed -i 's/^  flutter: [0-9].*/  flutter: ^3.47.1/' tests/fixtures/pubspec.yaml
          grep -qx '  flutter: ^3.47.1' tests/fixtures/pubspec.yaml
      - uses: ./setup
        with:
          working-directory: "tests/fixtures"
      - name: Assert lower bound was installed
        run: flutter --version | grep -F "Flutter 3.47.1 "

  test-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve valid matrix
        id: valid
        uses: ./matrix
        with:
          targets: '["linux", "ios", "windows"]'
          build-mode: "profile"

      - name: Assert valid matrix
        shell: bash
        env:
          MATRIX: ${{ steps.valid.outputs.matrix }}
          BUILD_MODE: ${{ steps.valid.outputs.build-mode }}
        run: |
          EXPECTED='[{"target":"linux","os":"ubuntu-latest"},{"target":"ios","os":"macos-latest"},{"target":"windows","os":"windows-latest"}]'
          if [ "$MATRIX" != "$EXPECTED" ]; then
            echo "Expected matrix $EXPECTED, got $MATRIX"
            exit 1
          fi
          if [ "$BUILD_MODE" != "profile" ]; then
            echo "Expected build-mode 'profile', got '$BUILD_MODE'"
            exit 1
          fi

      - name: Resolve invalid matrix
        id: invalid
        continue-on-error: true
        uses: ./matrix
        with:
          targets: '["linux", "bogus"]'

      - name: Assert invalid matrix failed
        shell: bash
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected invalid target to fail, got outcome '$OUTCOME'"
            exit 1
          fi

  test-verify-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./setup
        with:
          working-directory: "tests/fixtures"
      - name: Verify up-to-date fixture
        uses: ./verify-generated
        with:
          working-directory: "tests/fixtures"
      - name: Change the model without regenerating
        run: sed -i 's/required int y/required int y, int? z/' tests/fixtures/lib/sign.dart && git -c user.name=ci -c user.email=ci@localhost commit -qam stale
      - name: Verify stale fixture
        id: stale
        continue-on-error: true
        uses: ./verify-generated
        with:
          working-directory: "tests/fixtures"
      - name: Assert stale fixture failed
        env:
          OUTCOME: ${{ steps.stale.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected stale generated files to fail, got outcome '$OUTCOME'"
            exit 1
          fi

  # Runs main's actions (ci.yml references them @main), so this covers the workflow's wiring, not this checkout's actions.
  test-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    with:
      targets: '["linux"]'
      working-directory: "tests/fixtures"
      coverage-report: true
      # ponytail: ci.yml calls verify-generated@main, which doesn't exist before this lands; add `verify-generated: true` in a follow-up PR

  test-ci-coverage:
    needs: test-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-coverage
      - name: Assert coverage is filtered and repo-relative
        run: |
          grep -qx 'SF:tests/fixtures/lib/sign.dart' lcov.info
          if grep -E '^SF:.*\.(g|freezed)\.dart$' lcov.info; then echo "Generated files not filtered"; exit 1; fi
          if grep '^SF:' lcov.info | grep -v '^SF:tests/fixtures/'; then echo "Paths not repo-relative"; exit 1; fi
          grep -q '^DA:[0-9]*,0$' lcov.info || { echo "Uncovered line missing"; exit 1; }
