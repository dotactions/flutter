name: Test Flutter Actions

on:
  pull_request:
    paths:
      - "build/**"
      - "setup/**"
      - "matrix/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/internal-test.yml"
      - "tests/fixtures/**"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "setup/**"
      - "matrix/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
      - ".github/workflows/internal-test.yml"
      - "tests/fixtures/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: "release"
            expected-suffix: ""
          - build-mode: "debug"
            expected-suffix: "-debug"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test build (${{ matrix.build-mode }})
        id: build-app
        uses: ./build
        with:
          target: "linux"
          build-mode: ${{ matrix.build-mode }}
          working-directory: "tests/fixtures"
      - name: Assert build artifacts and outputs
        shell: bash
        env:
          EXPECTED_NAME: "test_app-linux${{ matrix.expected-suffix }}"
          ARTIFACT_NAME: ${{ steps.build-app.outputs.artifact-name }}
          ARTIFACT_PATH: ${{ steps.build-app.outputs.artifact-path }}
        run: |
          DIST_DIR="$RUNNER_TEMP/flutter-dist/linux"
          test -f "$DIST_DIR/${EXPECTED_NAME}.tar.gz"
          tar -tzf "$DIST_DIR/${EXPECTED_NAME}.tar.gz" > /dev/null
          if [ "$ARTIFACT_NAME" != "$EXPECTED_NAME" ]; then
            echo "Expected artifact-name '$EXPECTED_NAME', got '$ARTIFACT_NAME'"
            exit 1
          fi
          if [ "$ARTIFACT_PATH" != "$DIST_DIR/*" ]; then
            echo "Expected artifact-path '$DIST_DIR/*', got '$ARTIFACT_PATH'"
            exit 1
          fi
          if [ -e tests/fixtures/dist ]; then
            echo "Packaging must not write into the working directory"
            exit 1
          fi

  test-setup-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use a caret constraint in the fixture
        run: |
          sed -i 's/^  flutter: [0-9].*/  flutter: ^3.47.1/' tests/fixtures/pubspec.yaml
          grep -qx '  flutter: ^3.47.1' tests/fixtures/pubspec.yaml
      - uses: ./setup
        with:
          working-directory: "tests/fixtures"
      - name: Assert lower bound was installed
        run: flutter --version | grep -F "Flutter 3.47.1 "

  test-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve valid matrix
        id: valid
        uses: ./matrix
        with:
          targets: '["linux", "ios", "windows"]'
          build-mode: "profile"

      - name: Assert valid matrix
        shell: bash
        env:
          MATRIX: ${{ steps.valid.outputs.matrix }}
          BUILD_MODE: ${{ steps.valid.outputs.build-mode }}
        run: |
          EXPECTED='[{"target":"linux","os":"ubuntu-latest"},{"target":"ios","os":"macos-latest"},{"target":"windows","os":"windows-latest"}]'
          if [ "$MATRIX" != "$EXPECTED" ]; then
            echo "Expected matrix $EXPECTED, got $MATRIX"
            exit 1
          fi
          if [ "$BUILD_MODE" != "profile" ]; then
            echo "Expected build-mode 'profile', got '$BUILD_MODE'"
            exit 1
          fi

      - name: Resolve invalid matrix
        id: invalid
        continue-on-error: true
        uses: ./matrix
        with:
          targets: '["linux", "bogus"]'

      - name: Assert invalid matrix failed
        shell: bash
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Expected invalid target to fail, got outcome '$OUTCOME'"
            exit 1
          fi

  # Runs main's actions (ci.yml references them @main), so this covers the workflow's wiring, not this checkout's actions.
  test-ci:
    uses: ./.github/workflows/ci.yml
    with:
      targets: '["linux"]'
      working-directory: "tests/fixtures"
