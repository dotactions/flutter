name: Test Scripts

on:
  pull_request:
    paths: &paths
      - "**/scripts/**"
      - "build/targets.json"
      - "tests/*.sh"
      - ".tooling"
      - ".github/workflows/internal-test-scripts.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scripts:
    uses: dotactions/tooling/.github/workflows/test-scripts.yml@195e9ff7bbf3476b7fd9a9e3d9c05554c3b37fb5 # v1.2.1
