name: Test Scripts

on:
  pull_request:
    paths: &paths
      - "**/scripts/**"
      - "build/targets.json"
      - "tests/*.sh"
      - ".tooling"
      - ".github/workflows/internal-test-scripts.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scripts:
    uses: dotactions/tooling/.github/workflows/test-scripts.yml@47e8ca68959cee5ae7b65b8110f4cf7d0a89decd # v1.1.0
